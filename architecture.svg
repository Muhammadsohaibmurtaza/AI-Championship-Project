<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<rect width="1200" height="560" rx="24" fill="#f8fafc"/>
<text x="60" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#152238">ProofPilot AI — Proposed Data Flow</text>
<text x="60" y="94" font-family="Arial,sans-serif" font-size="16" fill="#526174">Conceptual architecture for the MVP</text>
<rect x="60" y="150" width="220" height="90" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="2"/><text x="170.0" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#152238">1. Upload PDF</text><text x="170.0" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#526174">React UI</text><rect x="340" y="150" width="220" height="90" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="2"/><text x="450.0" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#152238">2. Validate & extract</text><text x="450.0" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#526174">FastAPI + PyMuPDF</text><rect x="620" y="150" width="220" height="90" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="2"/><text x="730.0" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#152238">3. Analyze</text><text x="730.0" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#526174">LLM + structured schema</text><rect x="900" y="150" width="240" height="90" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="2"/><text x="1020.0" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#152238">4. Verify evidence</text><text x="1020.0" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#526174">Page/quote checks</text><rect x="340" y="350" width="220" height="90" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="2"/><text x="450.0" y="385" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#152238">5. Findings</text><text x="450.0" y="412" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#526174">Gaps • ambiguity • claims</text><rect x="700" y="350" width="260" height="90" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="2"/><text x="830.0" y="385" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#152238">6. Report</text><text x="830.0" y="412" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#526174">Evidence + uncertainty</text><path d="M280 195 L340 195" stroke="#475569" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M560 195 L620 195" stroke="#475569" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M840 195 L900 195" stroke="#475569" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M1020 240 L1020 290" stroke="#475569" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M900 395 L700 395" stroke="#475569" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M450 240 L450 350" stroke="#475569" stroke-width="3" fill="none" stroke-linecap="round"/><polygon points="340,195 330,189 330,201" fill="#475569"/><polygon points="620,195 610,189 610,201" fill="#475569"/><polygon points="900,195 890,189 890,201" fill="#475569"/><polygon points="1020,290 1014,280 1026,280" fill="#475569"/><polygon points="700,395 710,389 710,401" fill="#475569"/><polygon points="450,350 444,340 456,340" fill="#475569"/><text x="60" y="510" font-family="Arial,sans-serif" font-size="16" fill="#526174">Design principle: every supported finding should link to source evidence; uncertain findings must be labelled.</text></svg>